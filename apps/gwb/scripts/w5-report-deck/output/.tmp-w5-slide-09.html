<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1350, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face { font-family: 'Anton'; src: url('file:///workspace/apps/gwb/public/fonts/Anton-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Bebas Neue'; src: url('file:///workspace/apps/gwb/public/fonts/BebasNeue-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Inter'; src: url('file:///workspace/apps/gwb/public/fonts/Inter-Variable.ttf') format('truetype'); font-weight: 100 900; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 1080px; height: 1350px; overflow: hidden; }
body {
  width: 1080px; height: 1350px; overflow: hidden; margin: 0;
  background: #0a0f14; color: #f4f7fb;
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  position: relative;
}
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
.anton { font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
.inter { font-family: 'Inter', sans-serif; }
.inter-semibold { font-family: 'Inter', sans-serif; font-weight: 600; }
.kicker { font-size: 28px; color: #e8b923; line-height: 1.35; }
.kicker-line { height: 2px; background: rgba(143, 163, 184, 0.35); margin-top: 12px; width: 100%; }
.footer {
  position: absolute; left: 72px; right: 72px; bottom: 24px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 22px; color: #8fa3b8; z-index: 20;
}
.footer-zone { padding-bottom: 72px; }

.slide { background: #0a0f14; }
.hdr { position: absolute; left: 72px; right: 72px; top: 48px; z-index: 3; }
.title-split { margin-top: 20px; font-size: 62px; line-height: 1.1; }
.title-split .gold { color: #e8b923; }
.body-block {
  position: absolute; left: 72px; right: 72px; z-index: 3;
  font-size: 26px; line-height: 1.45; color: #c8d4e0; font-weight: 600;
}
.body-block p { margin-bottom: 10px; }
.footnote {
  position: absolute; left: 72px; right: 72px; bottom: 72px; z-index: 3;
  text-align: center; font-size: 22px; color: #8fa3b8; letter-spacing: 0.06em;
}
.bg-hero {
  position: absolute; inset: 0; z-index: 1;
}
.bg-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; transform: scale(1.08); }
.bg-scrim { position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, rgba(10,15,20,0.92) 0%, rgba(10,15,20,0.55) 42%, rgba(10,15,20,0.88) 100%); }
.dual-cards { position: absolute; left: 72px; right: 72px; top: 320px; height: 520px; z-index: 3; display: flex; gap: 24px; justify-content: center; }
.dual-cards .card {
  width: 420px; height: 100%; border-radius: 16px; overflow: hidden; border: 3px solid #e8b923;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.dual-cards .card.dim { border-color: #4a5058; }
.dual-cards img { width: 100%; height: 100%; object-fit: cover; object-position: center 14%; transform: scale(1.05); }
.info-stack {
  position: absolute; left: 96px; right: 96px; top: 868px; z-index: 3;
  background: rgba(18, 24, 32, 0.96); border-left: 4px solid #e8b923; padding: 22px 28px;
}
.info-stack p { font-size: 24px; color: #b8c4d0; line-height: 1.42; margin-top: 8px; font-weight: 600; }
.stat-grid {
  position: absolute; left: 72px; right: 72px; top: 280px; z-index: 3;
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
.stat-box {
  background: rgba(18, 24, 32, 0.96); padding: 22px 24px; border-top: 3px solid #e8b923;
}
.stat-box .label { font-size: 24px; color: #8fa3b8; letter-spacing: 0.08em; }
.stat-box .value { margin-top: 10px; font-size: 30px; color: #f4f7fb; line-height: 1.2; }
.stat-box .sub { margin-top: 8px; font-size: 22px; color: #e8b923; }
.list-panel {
  position: absolute; left: 88px; right: 88px; top: 248px; z-index: 3;
  background: rgba(18, 24, 32, 0.96); padding: 18px 22px; max-height: 880px; overflow: hidden;
}
.row { display: flex; gap: 16px; font-size: 26px; font-weight: 600; color: #b8c4d0; padding: 12px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.row .n { color: #e8b923; min-width: 44px; }
.row .name { color: #f4f7fb; flex: 1; }
.row .pts { color: #e8b923; text-align: right; min-width: 100px; }
.cover-text { position: absolute; left: 72px; top: 48px; width: 620px; z-index: 3; padding-right: 20px; }
.cover-hero {
  position: absolute; right: 0; top: 0; width: 420px; height: 1350px; z-index: 2; overflow: hidden;
}
.cover-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; transform: scale(1.1); }
.cover-hero .veil { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0f14 0%, transparent 35%); }
</style>
</head>
<body><div class="slide">
  <div class="bg-hero"><img src="file:///workspace/apps/gwb/scripts/w5-result-cards/assets/results-w5-m4-loser.jpg" alt=""/></div><div class="bg-scrim"></div>
  <div class="hdr">
    <div class="kicker bebas">FRANKIE ZONE</div>
    <div class="kicker-line"></div>
    <h1 class="title-split anton">STILL<br/><span class="gold anton">OPEN</span></h1>
  </div>
  
  <div class="body-block inter-semibold" style="top:300px"><p>Frankie drops to 1-4.</p><p>Score: 101.06 in the HADY rout.</p><p>The zone signage remains fully operational.</p></div>
  
  <div class="footer inter"><span>gwb_fantasy_football</span><span class="bebas">9/16</span></div>
</div></body></html>
