<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1350, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face { font-family: 'Anton'; src: url('file:///workspace/apps/gwb/public/fonts/Anton-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Bebas Neue'; src: url('file:///workspace/apps/gwb/public/fonts/BebasNeue-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Inter'; src: url('file:///workspace/apps/gwb/public/fonts/Inter-Variable.ttf') format('truetype'); font-weight: 100 900; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 1080px; height: 1350px; overflow: hidden; }
body {
  width: 1080px; height: 1350px; overflow: hidden; margin: 0;
  background: #0a0f14; color: #f4f7fb;
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  position: relative;
}
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
.anton { font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
.inter { font-family: 'Inter', sans-serif; }
.inter-semibold { font-family: 'Inter', sans-serif; font-weight: 600; }
.kicker { font-size: 28px; color: #e8b923; line-height: 1.35; }
.kicker-line { height: 2px; background: rgba(143, 163, 184, 0.35); margin-top: 12px; width: 100%; }
.footer {
  position: absolute; left: 72px; right: 72px; bottom: 24px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 22px; color: #8fa3b8; z-index: 20;
}
.footer-zone { padding-bottom: 72px; }

.slide { background: #000; }
.hdr { position: absolute; left: 72px; right: 72px; top: 48px; }
.hero { margin-top: 22px; display: flex; align-items: baseline; gap: 22px; font-size: 72px; line-height: 1.18; color: #f4f7fb; }
.hero .vs { font-size: 72px; }
.records { margin-top: 18px; font-size: 26px; color: #e8b923; display: flex; gap: 30px; align-items: center; }
.card { position: absolute; top: 276px; width: 400px; height: 720px; border-radius: 18px; overflow: hidden; background: #111; }
.card.left { left: 72px; }
.card.right { left: 608px; }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.badge { position: absolute; top: 18px; padding: 10px 18px; border-radius: 999px; background: #e8b923; color: #111;
  font-size: 22px; line-height: 1; z-index: 3; }
.badge.left { left: 16px; }
.badge.right { right: 16px; }
.vs-badge {
  position: absolute; left: 494px; top: 600px; width: 92px; height: 92px; border-radius: 50%;
  background: #e8b923; color: #111; z-index: 4;
  display: flex; align-items: center; justify-content: center; font-size: 36px;
}
.sneaky { position: absolute; left: 72px; right: 72px; top: 1048px; text-align: center; font-size: 34px; color: #e8b923; }
.poll { position: absolute; left: 72px; right: 72px; top: 1108px; }
.poll-labels { display: flex; justify-content: space-between; font-size: 32px; margin-bottom: 10px; }
.poll-labels .l { color: #e8b923; }
.poll-labels .r { color: #f4f7fb; }
.poll-bar { display: flex; height: 34px; overflow: hidden; }
.poll-bar .a { width: 52%; background: #e8b923; }
.poll-bar .b { width: 48%; background: #2d343c; }
.detail { position: absolute; left: 72px; right: 72px; top: 1228px; text-align: center; font-size: 24px; color: #8fa3b8; }
</style>
</head>
<body><div class="slide">
  <div class="hdr">
    <div class="kicker bebas">GWB &nbsp;•&nbsp; WEEK 5</div>
    <div class="kicker-line"></div>
    <h1 class="hero anton"><span>Hady</span><span class="vs">vs</span><span>FRANKIE</span></h1>
    <div class="records bebas"><span>Hady (3-1)</span><span>vs</span><span>FRANKIE (1-3)</span></div>
  </div>
  <div class="card left"><img src="file:///workspace/apps/gwb/scripts/remake-held/assets/vs-w5-m4-left.png" alt="" /><span class="badge left bebas">Hady 3-1</span></div>
  <div class="vs-badge bebas">VS</div>
  <div class="card right"><img src="file:///workspace/apps/gwb/scripts/remake-held/assets/vs-w5-m4-right.png" alt="" /><span class="badge right bebas">FRANKIE 1-3</span></div>
  <div class="sneaky bebas">NO REST FOR THE POOR</div>
  <div class="poll">
    <div class="poll-labels bebas"><span class="l">Hady 54%</span><span class="r">Frankie 46%</span></div>
    <div class="poll-bar"><div class="a" style="width:54%"></div><div class="b" style="width:46%"></div></div>
  </div>
  <p class="detail inter">Kyler vs Goff • Frankie's first win came in Week 4</p>
  <div class="footer inter"><span>gwb_fantasy_football</span><span>VS &nbsp;•&nbsp; M4</span></div>
</div></body></html>
