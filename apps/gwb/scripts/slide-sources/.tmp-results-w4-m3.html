<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1350, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face { font-family: 'Anton'; src: url('file:///workspace/apps/gwb/public/fonts/Anton-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Bebas Neue'; src: url('file:///workspace/apps/gwb/public/fonts/BebasNeue-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Inter'; src: url('file:///workspace/apps/gwb/public/fonts/Inter-Variable.ttf') format('truetype'); font-weight: 100 900; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 1080px; height: 1350px; overflow: hidden; }
body {
  width: 1080px; height: 1350px; overflow: hidden; margin: 0;
  background: #0a0f14; color: #f4f7fb;
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  position: relative;
}
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
.anton { font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
.inter { font-family: 'Inter', sans-serif; }
.inter-semibold { font-family: 'Inter', sans-serif; font-weight: 600; }
.kicker { font-size: 28px; color: #e8b923; line-height: 1.35; }
.kicker-line { height: 2px; background: rgba(143, 163, 184, 0.35); margin-top: 12px; width: 100%; }
.footer {
  position: absolute; left: 72px; right: 72px; bottom: 24px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 22px; color: #8fa3b8; z-index: 20;
}
.footer-zone { padding-bottom: 72px; }

.slide { background: #080c10; }
.hdr { position: absolute; left: 72px; right: 72px; top: 48px; text-align: center; }
.final { font-size: 62px; line-height: 1.18; margin-top: 22px; }
.scoreline { margin-top: 14px; font-size: 36px; color: #e8b923; letter-spacing: 0.04em; }
.cards { position: absolute; left: 0; right: 0; top: 268px; height: 700px; }
.winner {
  position: absolute; left: 56px; top: 0; width: 440px; height: 680px; border-radius: 16px;
  border: 3px solid rgba(232,185,35,0.5); z-index: 1; background: #111;
}
.loser {
  position: absolute; left: 584px; top: 40px; width: 440px; height: 620px; border-radius: 16px;
  border: 2px solid #3a4454; z-index: 1; background: #111;
}
.card-art { position: absolute; left: 0; right: 0; top: 0; bottom: 64px; overflow: hidden; }
.card-art img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.medal {
  position: absolute; left: 502px; top: 300px; width: 76px; height: 76px; border-radius: 50%;
  background: #e8b923; color: #111; font-size: 44px; z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
.tag { position: absolute; padding: 8px 18px; border-radius: 999px; font-family: 'Bebas Neue'; font-size: 24px; z-index: 4; }
.tag.wt { top: 16px; left: 16px; background: #e8b923; color: #111; }
.tag.lt { top: 16px; left: 16px; background: #2a3340; color: #f4f7fb; }
.tag.wb { bottom: 16px; right: 16px; background: #e8b923; color: #111; }
.tag.lb { bottom: 16px; right: 16px; background: #3a4454; color: #f4f7fb; }
.mid { position: absolute; left: 72px; right: 72px; top: 998px; text-align: center; }
.mid h2 { font-size: 38px; color: #e8b923; }
.scores { display: flex; justify-content: space-between; margin-top: 14px; font-size: 28px; }
.scores .g { color: #e8b923; }
.bar { position: absolute; left: 72px; right: 72px; top: 1092px; height: 30px; display: flex; overflow: hidden; border-radius: 2px; }
.bar .w { background: #e8b923; }
.bar .l { background: #2d343c; }
.caption { position: absolute; left: 72px; right: 72px; top: 1138px; text-align: center; font-size: 24px; color: #8fa3b8; }
</style>
</head>
<body><div class="slide">
  <div class="hdr">
    <div class="kicker bebas">GWB &nbsp;•&nbsp; WEEK 4</div>
    <div class="kicker-line"></div>
    <h1 class="final anton">FINAL: Hady TAKES IT</h1>
    <p class="scoreline bebas">Hady 141.7 — 134.9 MANNY</p>
  </div>
  <div class="cards">
    <div class="winner">
      <div class="card-art"><img src="file:///workspace/apps/gwb/scripts/remake-held/assets/results-w4-m3-winner.png" alt="" /></div>
      <span class="tag wt">Hady 3-1</span>
      <span class="tag wb">WINNER</span>
    </div>
    <div class="medal bebas">W</div>
    <div class="loser">
      <div class="card-art"><img src="file:///workspace/apps/gwb/scripts/remake-held/assets/results-w4-m3-loser.png" alt="" /></div>
      <span class="tag lt">MANNY 2-2</span>
      <span class="tag lb">LOSER</span>
    </div>
  </div>
  <div class="mid">
    <h2 class="bebas">EL CAMPEON HOLDS</h2>
    <div class="scores bebas"><span class="g">Hady 141.7</span><span>134.9 MANNY</span></div>
  </div>
  <div class="bar"><div class="w" style="width:51%"></div><div class="l" style="width:49%"></div></div>
  <p class="caption inter">Hady stays at 3-1 — Manny drops to 2-2</p>
  <div class="footer inter"><span>gwb_fantasy_football</span><span>RESULTS &nbsp;•&nbsp; W4M3</span></div>
</div></body></html>
