<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face { font-family: 'Anton'; src: url('file:///workspace/apps/gwb/scripts/fonts-local/Anton-Regular.ttf'); }
@font-face { font-family: 'Bebas'; src: url('file:///workspace/apps/gwb/scripts/fonts-local/BebasNeue-Regular.ttf'); }
@font-face { font-family: 'Inter'; src: url('file:///workspace/apps/gwb/scripts/fonts-local/Inter-SemiBold.ttf'); font-weight: 600; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030406; }
.slide {
  width: 1080px; height: 1350px;
  background: #030406;
  color: #fff;
  font-family: 'Anton', sans-serif;
  position: relative;
  overflow: hidden;
}
.top-bar {
  position: absolute; left: 0; right: 0; top: 0; height: 14px;
  background: linear-gradient(180deg, #f0c84a 0%, #d4af37 55%, #b8922a 100%);
  z-index: 10;
}
.header {
  padding: 38px 52px 0;
}
.kicker {
  font-family: 'Bebas', sans-serif;
  font-size: 38px;
  letter-spacing: 0.12em;
  color: #d4af37;
  margin-bottom: 10px;
}
.kicker-line {
  height: 2px; width: 100%;
  background: linear-gradient(90deg, #d4af37 0%, rgba(212,175,55,0.12) 100%);
  margin-bottom: 16px;
}
.headline {
  font-size: 96px;
  line-height: 0.92;
  letter-spacing: 0.015em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.headline .vs {
  font-size: 58px;
  color: #b8bcc4;
  margin: 0 0.14em;
  text-transform: lowercase;
  font-weight: 400;
}
.records {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 44px;
  letter-spacing: 0.02em;
  color: #d4af37;
  margin-bottom: 2px;
  text-transform: none;
}
.panels {
  position: relative;
  margin: 46px 40px 0;
  height: 668px;
  display: flex;
  gap: 22px;
  justify-content: center;
  align-items: stretch;
}
.panel {
  width: 486px;
  border-radius: 18px;
  position: relative;
  overflow: hidden;
  background: #0c0e12;
}
.panel-left {
  border: 3px solid #d4af37;
  box-shadow: 0 0 32px rgba(212,175,55,0.28), inset 0 0 0 1px rgba(0,0,0,0.5);
}
.panel-right {
  border: 3px solid #e87898;
  box-shadow: 0 0 28px rgba(232,120,152,0.32), inset 0 0 0 1px rgba(0,0,0,0.45);
}
.panel img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 10%;
  display: block;
}
.pill {
  position: absolute;
  font-family: 'Bebas', sans-serif;
  font-size: 32px;
  letter-spacing: 0.06em;
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(8,8,10,0.88);
  z-index: 2;
  text-transform: uppercase;
}
.pill-left {
  top: 16px; left: 16px;
  border: 2px solid #d4af37;
  color: #d4af37;
}
.pill-right {
  top: 16px; right: 16px; left: auto;
  border: 2px solid #e87898;
  color: #f0b8c8;
  background: rgba(12,8,10,0.9);
}
.vs-badge {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 207px;
  height: 207px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f5dc6a, #d4af37 52%, #9a7a18);
  border: 8px solid #1a1408;
  box-shadow: 0 0 42px rgba(212,175,55,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  line-height: 1;
  color: #0a0806;
  z-index: 6;
}
.mid {
  text-align: center;
  margin-top: 22px;
  padding: 0 52px;
}
.bowl {
  font-size: 60px;
  letter-spacing: 0.05em;
  color: #d4af37;
  margin-bottom: 16px;
  line-height: 1.02;
}
.pct-row {
  display: flex;
  justify-content: space-between;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 38px;
  margin-bottom: 10px;
  letter-spacing: 0.02em;
  text-transform: none;
}
.pct-left { color: #d4af37; }
.pct-right { color: #f0f2f5; }
.bar {
  height: 40px;
  border-radius: 6px;
  overflow: hidden;
  background: #1e242c;
  display: flex;
}
.bar-fill { background: linear-gradient(90deg, #efcc55, #c9a227); height: 100%; }
.tagline {
  margin-top: 16px;
  font-family: 'Inter', sans-serif;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: none;
  color: #9aa0a8;
}
.footer {
  position: absolute;
  left: 56px;
  right: 56px;
  bottom: 38px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'Inter', sans-serif;
}
.footer-left {
  font-size: 22px;
  color: #4a5058;
  font-weight: 600;
}
.footer-right {
  font-family: 'Bebas', sans-serif;
  font-size: 30px;
  letter-spacing: 0.1em;
  color: #f4f6f8;
}
</style>
</head>
<body>
<div class="slide">
  <div class="top-bar"></div>
  <div class="header">
    <div class="kicker">GWB • WEEK 5</div>
    <div class="kicker-line"></div>
    <div class="headline">STEVEN <span class="vs">vs</span> CROOKE</div>
    <div class="records">STEVEN (4-0)   vs   CROOKE (1-3)</div>
  </div>
  <div class="panels">
    <div class="panel panel-left">
      <div class="pill pill-left">STEVEN 4-0</div>
      <img src="file:///workspace/apps/gwb/scripts/w5-matchup-cards/assets/vs-w5-m1-left.jpg" alt=""/>
    </div>
    <div class="vs-badge">VS</div>
    <div class="panel panel-right">
      <div class="pill pill-right">CROOKE 1-3</div>
      <img src="file:///workspace/apps/gwb/scripts/w5-matchup-cards/assets/vs-w5-m1-right.jpg" alt=""/>
    </div>
  </div>
  <div class="mid">
    <div class="bowl">THE FINAL BOSS</div>
    <div class="pct-row">
      <span class="pct-left">Steven 65%</span>
      <span class="pct-right">Crooke 35%</span>
    </div>
    <div class="bar">
      <div class="bar-fill" style="width: 65%"></div>
    </div>
    <div class="tagline">Darnold vs Stroud • Steven 714 PF through Week 4</div>
  </div>
  <div class="footer">
    <span class="footer-left">gwb_fantasy_football</span>
    <span class="footer-right">VS • M1</span>
  </div>
</div>
</body>
</html>
