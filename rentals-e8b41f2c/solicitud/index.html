<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Pagar el fee de bloqueo — EC Boutique Apartments</title>
  <meta name="description" content="Formulario para pagar el fee de bloqueo. Elizabeth Crooke. Sin montos en la página.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="fee">
  <a class="skip" href="#content" data-i18n="skip"></a>
  <header class="site-header">
    <a class="brand" href="../">EC Boutique Apartments</a>
    <div class="lang" role="group" data-i18n-aria="langLabel">
      <button type="button" data-set-lang="es" lang="es">ES</button>
      <button type="button" data-set-lang="en" lang="en">EN</button>
      <button type="button" data-set-lang="fr" lang="fr">FR</button>
    </div>
  </header>

  <main id="content">
    <section class="section" id="contact">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no">·</span>
          <h2 data-i18n="feePageTitle"></h2>
        </div>
        <p class="intro" data-i18n="feePageIntro"></p>
        <p class="email-line">
          <span class="contact-name">Elizabeth Crooke</span><br>
          <a id="contact-email" href="mailto:elicrooke25@gmail.com">elicrooke25@gmail.com</a>
        </p>
        <p class="meta" data-i18n="requiredHint"></p>

        <form id="inquiry-form" name="fee-request" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="fee-request">
          <input type="hidden" name="resumen" id="fee-resumen" value="">
          <p class="hp"><label>No llenar: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
          <div id="form-errors" role="alert"></div>
          <div class="form-grid two">
            <label class="field req">
              <span data-i18n="labelName"></span>
              <input id="in-name" name="nombre" autocomplete="name" required>
            </label>
            <label class="field req">
              <span data-i18n="labelCountry"></span>
              <input id="in-country" name="pais" autocomplete="country-name" required>
            </label>
            <label class="field req">
              <span data-i18n="labelEmail"></span>
              <input id="in-email" name="correo" type="email" inputmode="email" autocomplete="email" spellcheck="false" required>
            </label>
            <label class="field req">
              <span data-i18n="labelPhone"></span>
              <input id="in-phone" name="telefono" type="tel" inputmode="tel" autocomplete="tel" required>
            </label>
            <label class="field req">
              <span data-i18n="labelApt"></span>
              <select id="in-apt" name="apartamento" required>
                <option value="">Elija un apartamento</option>
                <option value="d12">D12 · dos habitaciones</option>
                <option value="d2">D2 · una habitación</option>
                <option value="d1">D1 · una habitación</option>
                <option value="apt4">Apartamento 4</option>
              </select>
            </label>
          </div>

          <div id="party-wrap" hidden>
            <label class="field req">
              <span data-i18n="partyLegend"></span>
              <select id="in-party" name="personas">
                <option value="" data-i18n-opt="partyChoose"></option>
                <option value="Una persona (adulto)" data-i18n-opt="party1"></option>
                <option value="Dos personas (adultos)" data-i18n-opt="party2"></option>
                <option value="Dos parejas (adultos) — 4 adultos" data-i18n-opt="party4"></option>
                <option value="Una familia: dos adultos y 1 niño" data-i18n-opt="partyFamily1"></option>
                <option value="Una familia: dos adultos y 2 niños" data-i18n-opt="partyFamily2"></option>
              </select>
            </label>
          </div>

          <div class="stay-box" id="stay-box">
            <h3 data-i18n="calTitle"></h3>
            <p class="meta" data-i18n="calMoveNote"></p>
            <div id="stay-calendar"></div>
            <p class="stay-length" id="stay-length" aria-live="polite"></p>
            <input id="in-arrive" name="llegada" type="hidden">
            <input id="in-depart" name="salida" type="hidden">
          </div>

          <fieldset class="visit">
            <legend data-i18n="visitLegend"></legend>
            <label class="choice"><input type="radio" name="visit-mode" value="none"> <span data-i18n="visitNone"></span></label>
            <label class="choice"><input type="radio" name="visit-mode" value="send"> <span data-i18n="visitSend"></span></label>
            <label class="choice"><input type="radio" name="visit-mode" value="own"> <span data-i18n="visitOwn"></span></label>
            <p class="meta" data-i18n="visitProposal"></p>
            <div id="own-time" class="form-grid two" hidden>
              <label class="field">
                <span data-i18n="ownDate"></span>
                <input id="own-date" name="own-date" type="date">
              </label>
              <label class="field">
                <span data-i18n="ownTime"></span>
                <input id="own-time-input" name="own-time" type="time">
              </label>
            </div>
            <p class="meta" data-i18n="visitBefore"></p>
            <p class="meta" data-i18n="visitKeepsBlock"></p>
            <input type="hidden" name="opcion_visita" id="visit-choice" value="">
          </fieldset>

          <fieldset class="visit" id="pets-field">
            <legend data-i18n="petsLegend"></legend>
            <label class="choice"><input type="radio" name="pets" value="no"> <span data-i18n="noWord"></span></label>
            <label class="choice"><input type="radio" name="pets" value="yes"> <span data-i18n="yesWord"></span></label>
            <div id="pet-types" hidden>
              <p class="meta" data-i18n="petTypeLabel"></p>
              <label class="choice"><input type="checkbox" name="pet-type" value="perro"> <span data-i18n="petDog"></span></label>
              <label class="choice"><input type="checkbox" name="pet-type" value="gato"> <span data-i18n="petCat"></span></label>
              <label class="choice"><input type="checkbox" name="pet-type" value="conejo"> <span data-i18n="petRabbit"></span></label>
              <label class="choice"><input type="checkbox" name="pet-type" value="pajaritos"> <span data-i18n="petBirds"></span></label>
              <label class="choice"><input type="checkbox" name="pet-type" value="cotorras"> <span data-i18n="petParrots"></span></label>
              <label class="choice"><input type="checkbox" name="pet-type" value="otros"> <span data-i18n="petOther"></span></label>
              <label class="field" id="pet-other-wrap" hidden>
                <span data-i18n="petWhich"></span>
                <input id="pet-other" name="pet-other" maxlength="80">
              </label>
              <label class="field" id="pet-count-wrap">
                <span data-i18n="petCountLabel"></span>
                <input id="pet-count" name="pet-count" type="number" min="1" step="1" inputmode="numeric">
              </label>
            </div>
          </fieldset>

          <fieldset class="visit" id="kids-field">
            <legend data-i18n="kidsLegend"></legend>
            <label class="choice"><input type="radio" name="kids" value="no"> <span data-i18n="noWord"></span></label>
            <label class="choice"><input type="radio" name="kids" value="yes"> <span data-i18n="yesWord"></span></label>
            <div id="kids-detail" class="form-grid two" hidden>
              <label class="field">
                <span data-i18n="kidsCountLabel"></span>
                <input id="kids-count" name="kids-count" type="number" min="1" step="1" inputmode="numeric">
              </label>
              <label class="field">
                <span data-i18n="kidsAgesLabel"></span>
                <input id="kids-ages" name="kids-ages" maxlength="80" autocomplete="off">
              </label>
            </div>
          </fieldset>

          <fieldset class="visit" id="term-field">
            <legend data-i18n="termLegend"></legend>
            <label class="choice"><input type="radio" name="term" value="year"> <span data-i18n="termYear"></span></label>
            <label class="choice"><input type="radio" name="term" value="less"> <span data-i18n="termLess"></span></label>
            <div id="block-dates" hidden>
              <p class="meta" data-i18n="blockLegend"></p>
              <div class="form-grid two">
                <label class="field">
                  <span data-i18n="blockStart"></span>
                  <input id="block-start" name="fecha_inicio" type="date">
                </label>
                <label class="field">
                  <span data-i18n="blockEnd"></span>
                  <input id="block-end" name="fecha_fin" type="date">
                </label>
              </div>
              <p class="stay-length" id="block-length" aria-live="polite"></p>
              <input type="hidden" name="duracion" id="block-duration" value="">
            </div>
          </fieldset>

          <p class="rate-note" data-i18n="holdNotice"></p>

          <label class="choice hold-choice">
            <input id="pay-fee" name="pagar_fee" type="checkbox" value="sí">
            <span data-i18n="feeCheck"></span>
          </label>

          <label class="field">
            <span data-i18n="labelNote"></span>
            <textarea id="in-note" name="nota" rows="4" maxlength="2000"></textarea>
          </label>

          <label class="choice hold-choice" id="warn-check">
            <input id="access-ok" name="advertencia" type="checkbox" value="sí" required>
            <a id="warn-check-link" href="../#warnings"></a>
          </label>

          <button class="button" type="submit" data-i18n="submitFee" disabled></button>
        </form>

        <div id="form-success" class="success" hidden role="status">
          <p data-i18n="thanksBody"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p><strong>EC Boutique Apartments</strong><br>Elizabeth Crooke<br>Gazcue, Santo Domingo</p>
      <p><a id="footer-email" href="mailto:elicrooke25@gmail.com">elicrooke25@gmail.com</a></p>
    </div>
  </footer>

  <script src="../listings.js"></script>
  <script src="../i18n.js"></script>
  <script src="../app.js"></script>
</body>
</html>
