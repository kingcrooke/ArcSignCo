<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>EC Boutique Apartments</title>
  <meta name="description" content="Apartamentos amueblados en Gazcue, Santo Domingo. Elizabeth Crooke. La tarifa se pide por correo; no está en la página.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#content" data-i18n="skip"></a>
  <header class="site-header">
    <a class="brand" href="#top">EC Boutique Apartments</a>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" data-i18n="menu"></button>
    <nav id="site-nav" class="site-nav" aria-label="Elizabeth Crooke">
      <a href="#about" data-i18n="navAbout"></a>
      <a href="#guests" data-i18n="navGuests"></a>
      <a href="#listings" data-i18n="navApartments"></a>
      <a href="#area" data-i18n="navArea"></a>
      <a href="#rules" data-i18n="navRules"></a>
      <a href="#warnings" data-i18n="navWarnings"></a>
      <a href="#hold" data-i18n="navHold"></a>
      <a href="#contact" data-i18n="navContact"></a>
    </nav>
    <div class="lang" role="group" data-i18n-aria="langLabel">
      <button type="button" data-set-lang="es" lang="es">ES</button>
      <button type="button" data-set-lang="en" lang="en">EN</button>
      <button type="button" data-set-lang="fr" lang="fr">FR</button>
    </div>
  </header>

  <main id="content">
    <section class="hero" id="top">
      <video class="hero-video" autoplay muted loop playsinline poster="media/hero-poster.webp">
        <source src="media/hero.mp4" type="video/mp4">
      </video>
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <p class="kicker" data-i18n="heroKicker"></p>
        <h1 data-i18n="heroTitle"></h1>
        <p class="lede" data-i18n="heroLede"></p>
        <p class="hero-text" data-i18n="heroText"></p>
        <div class="hero-actions">
          <a class="button" href="#listings" data-i18n="ctaListings"></a>
          <a class="button button-ghost" href="#contact" data-i18n="ctaWrite"></a>
          <a class="button button-ghost" href="solicitud/" data-i18n="ctaFee"></a>
        </div>
        <p class="hero-credit" data-i18n="heroVideo"></p>
      </div>
    </section>

    <section class="section" id="about">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no" data-i18n="aboutNo"></span>
          <h2 data-i18n="aboutTitle"></h2>
        </div>
        <p class="intro" data-i18n="aboutIntro"></p>
        <div class="principles">
          <article>
            <h3 data-i18n="careTitle"></h3>
            <p data-i18n="careBody"></p>
          </article>
          <article>
            <h3 data-i18n="dedTitle"></h3>
            <p data-i18n="dedBody"></p>
          </article>
          <article>
            <h3 data-i18n="comTitle"></h3>
            <p data-i18n="comBody"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section" id="guests">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no" data-i18n="guestsNo"></span>
          <h2 data-i18n="guestsTitle"></h2>
        </div>
        <div class="principles pair">
          <article>
            <h3 data-i18n="fitTitle"></h3>
            <p data-i18n="fitBody"></p>
          </article>
          <article>
            <h3 data-i18n="notTitle"></h3>
            <p data-i18n="notBody"></p>
          </article>
        </div>
        <p class="intro invite" data-i18n="inviteBody"></p>
      </div>
    </section>

    <section class="section" id="applies">
      <div class="wrap all-block">
        <div class="section-title">
          <span class="sec-no" data-i18n="appliesNo"></span>
          <h2 data-i18n="allTitle"></h2>
        </div>
        <h3 data-i18n="allPetsTitle"></h3>
        <p data-i18n="allPets"></p>
        <h3 data-i18n="allFeeTitle"></h3>
        <p data-i18n="allFee"></p>
        <h3 data-i18n="allPayTitle"></h3>
        <p data-i18n="allPay"></p>
        <h3 data-i18n="allRecTitle"></h3>
        <p data-i18n="allRec"></p>
      </div>
    </section>

    <section class="section sector-gazcue" id="listings">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no" data-i18n="listNo"></span>
          <h2 data-i18n="sectorGazcue"></h2>
        </div>
        <p class="intro" data-i18n="listIntro"></p>
        <div id="cards-gazcue" class="apt-cards"></div>
      </div>
    </section>

    <section class="section sector-honduras" id="listings-honduras">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no">05</span>
          <h2 data-i18n="sectorHonduras"></h2>
        </div>
        <div id="cards-honduras" class="apt-cards"></div>
      </div>
    </section>

    <section class="section sector-bellavista" id="listings-bellavista">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no">06</span>
          <h2 data-i18n="sectorBellavista"></h2>
        </div>
        <div id="cards-bellavista" class="apt-cards"></div>
      </div>
    </section>

    <section class="section" id="notes">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no">·</span>
          <h2 data-i18n="sampleTitle"></h2>
        </div>
        <p class="intro" data-i18n="sampleNote"></p>
        <div id="sample-notes" class="samples"></div>
      </div>
    </section>

    <section class="section" id="reviews" hidden>
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no">·</span>
          <h2 data-i18n="reviewsTitle"></h2>
        </div>
        <div id="review-list" class="reviews"></div>
      </div>
    </section>

    <section class="section" id="area">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no" data-i18n="areaNo"></span>
          <h2 data-i18n="areaTitle"></h2>
        </div>
        <p class="intro" data-i18n="areaBody"></p>
        <div id="neighborhood" class="neighborhood"></div>
        <div id="area-map"></div>
      </div>
    </section>

    <section class="section" id="rules">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no" data-i18n="rulesNo"></span>
          <h2 data-i18n="rulesTitle"></h2>
        </div>
        <p class="intro" data-i18n="rulesIntro"></p>
        <div id="rules-from-listings"></div>
      </div>
    </section>

    <section class="section warn-section" id="warnings">
      <div class="wrap">
        <div class="warn-card">
          <div class="section-title">
            <span class="sec-no" data-i18n="warnNo"></span>
            <h2 data-i18n="warnTitle"></h2>
          </div>
          <p data-i18n="warnLead"></p>
          <ul>
            <li data-i18n="warn1"></li>
            <li data-i18n="warn2"></li>
            <li data-i18n="warn3"></li>
            <li data-i18n="warn4"></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="section" id="hold">
      <div class="wrap hold-grid">
        <div>
          <div class="section-title">
            <span class="sec-no" data-i18n="holdNo"></span>
            <h2 data-i18n="holdTitle"></h2>
          </div>
          <p data-i18n="holdAll"></p>
          <p data-i18n="holdBody"></p>
          <p class="meta" id="viewing-summary"></p>
          <p class="meta" data-i18n="tzNote"></p>
          <button type="button" class="button" id="hold-jump" data-i18n="holdButton"></button>
        </div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="wrap">
        <div class="section-title">
          <span class="sec-no" data-i18n="contactNo"></span>
          <h2 data-i18n="contactTitle"></h2>
        </div>
        <p class="intro" data-i18n="contactIntro"></p>
        <p class="email-line">
          <span class="contact-name">Elizabeth Crooke</span><br>
          <a id="contact-email" href="mailto:elicrooke25@gmail.com">elicrooke25@gmail.com</a>
        </p>
        <p class="meta" data-i18n="emailTodo"></p>
        <p class="meta" data-i18n="tzNote"></p>
        <p class="meta"><span data-i18n="infoOrWrite"></span> <a href="mailto:elicrooke25@gmail.com">elicrooke25@gmail.com</a></p>

        <form id="info-form" name="info-request" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="info-request">
          <p class="hp"><label>No llenar: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
          <div id="info-errors" role="alert"></div>
          <div class="form-grid two">
            <label class="field req">
              <span data-i18n="labelFullName"></span>
              <input id="info-name" name="nombre" autocomplete="name" required>
            </label>
            <label class="field req">
              <span data-i18n="labelEmail"></span>
              <input id="info-email" name="correo" type="email" inputmode="email" autocomplete="email" spellcheck="false" required>
            </label>
            <label class="field req">
              <span data-i18n="labelInterest"></span>
              <select id="info-apt" name="apartamento" required>
                <option value="">Elija un apartamento</option>
                <option value="d12">D12 · dos habitaciones</option>
                <option value="d2">D2 · una habitación</option>
                <option value="d1">D1 · una habitación</option>
                <option value="apt4">Apartamento 4</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span data-i18n="labelNote"></span>
            <textarea id="info-note" name="nota" rows="4" maxlength="2000"></textarea>
          </label>
          <button class="button" type="submit" data-i18n="submitInfo"></button>
        </form>
        <div id="info-success" class="success" hidden role="status">
          <p data-i18n="thanksBody"></p>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-row">
      <p><strong>EC Boutique Apartments</strong><br>Elizabeth Crooke<br>Gazcue, Santo Domingo</p>
      <p>
        <a id="footer-email" href="mailto:elicrooke25@gmail.com">elicrooke25@gmail.com</a>
      </p>
    </div>
    <div class="wrap">
      <p class="meta" data-i18n="footerNote"></p>
      <h2 class="credits-title" data-i18n="creditsTitle"></h2>
      <ul id="credits" class="credits"></ul>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
    <button type="button" class="lb-backdrop" id="lightbox-backdrop" data-i18n-aria="close"></button>
    <figure class="lb-frame">
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button type="button" class="lb-close" id="lightbox-close" data-i18n="close"></button>
    <button type="button" class="lb-arrow prev" id="lightbox-prev" data-i18n-aria="galleryPrev">‹</button>
    <button type="button" class="lb-arrow next" id="lightbox-next" data-i18n-aria="galleryNext">›</button>
  </div>

  <noscript>
    <p>EC Boutique Apartments. Elizabeth Crooke, Gazcue, Santo Domingo. D12, D2, D1 y Apartamento 4. Correo: elicrooke25@gmail.com. Esta página necesita JavaScript.</p>
  </noscript>

  <script src="listings.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
