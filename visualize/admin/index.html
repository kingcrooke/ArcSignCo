<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Visualizer leads | Arc Signage Co</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/service-page.v6.css">
<link rel="stylesheet" href="/visualize/visualize.css">
<style>
  body { background: var(--cream); }
  main { width: min(1100px, calc(100% - 28px)); margin: 24px auto 48px; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: pre-line; }
  img { width: 160px; height: auto; background: var(--navy); }
  .lock { max-width: 420px; }
</style>
</head>
<body>
<main>
  <p><a href="/visualize/">Back to the visualizer</a></p>
  <h1>Visualizer leads</h1>
  <form id="lock" class="viz-panel lock">
    <label class="viz-field">Password<input id="password" type="password" autocomplete="current-password" required></label>
    <p class="viz-alert" id="err" hidden></p>
    <div class="viz-actions"><button class="btn gold" type="submit">Open leads</button></div>
  </form>
  <div id="list" hidden>
    <p id="empty">No leads yet.</p>
    <table>
      <thead><tr><th>When</th><th>Contact</th><th>Job</th><th>Email</th><th>Preview</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <pre id="detail" style="white-space:pre-wrap"></pre>
  </div>
</main>
<script type="module">
const err = document.getElementById("err");
document.getElementById("lock").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.hidden = true;
  const res = await fetch("/api/visualize/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("password").value }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { err.hidden = false; err.textContent = data.error || "Could not sign in."; return; }
  document.getElementById("lock").hidden = true;
  document.getElementById("list").hidden = false;
  const leads = await fetch("/api/visualize/admin/leads").then(r => r.json());
  const rows = document.getElementById("rows");
  const items = leads.leads || [];
  document.getElementById("empty").hidden = items.length > 0;
  const cell = (text) => {
    const td = document.createElement("td");
    td.textContent = text || "";
    return td;
  };
  for (const lead of items) {
    const tr = document.createElement("tr");
    tr.append(
      cell(lead.createdAt),
      cell([lead.name, lead.phone, lead.email].filter(Boolean).join("\n")),
      cell([lead.category, lead.timing, lead.quoteLabel].filter(Boolean).join("\n")),
      cell(lead.emailStatus),
    );
    const td = document.createElement("td");
    if (lead.compositeUrl) {
      const link = document.createElement("a");
      link.href = lead.compositeUrl;
      const img = document.createElement("img");
      img.src = lead.compositeUrl;
      img.alt = "Preview";
      link.append(img);
      td.append(link);
    }
    tr.append(td);
    tr.addEventListener("click", async () => {
      const full = await fetch(`/api/visualize/admin/leads/${lead.id}`).then(r => r.json());
      document.getElementById("detail").textContent = JSON.stringify(full.lead?.payload || {}, null, 2);
    });
    rows.append(tr);
  }
});
</script>
</body>
</html>
