<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Quote Engine · Arc Signage Co</title>
  <link rel="stylesheet" href="/ops-qel16cb/ops.css">
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <p class="eyebrow">Private · Arc Signage Co</p>
      <h1>Quote Engine</h1>
      <p>Enter the ops password for this environment.</p>
      <label class="field">Password <input type="password" id="gatePass" autocomplete="current-password"></label>
      <p class="err" id="gateErr" hidden></p>
      <button type="button" class="btn gold" id="gateBtn">Continue</button>
    </div>
  </div>
  <div id="app" hidden>
    <header class="top">
      <div>
        <p class="eyebrow">Quote Engine lite</p>
        <h1>Leads</h1>
      </div>
      <p class="meta" id="storageMode"></p>
      <p class="meta" id="rateCardStatus"></p>
    </header>
    <main class="layout">
      <section class="panel" aria-labelledby="rateCardTitle">
        <h2 id="rateCardTitle">Rate card</h2>
        <p class="hint">Import the Construction PM JSON once per environment. Values stay in Netlify Blobs — never in the public repo.</p>
        <label class="field">Import rate card (JSON)
          <input type="file" id="rateCardFile" accept="application/json,.json">
        </label>
        <p class="err" id="importErr" hidden></p>
        <p class="ok" id="importOk" hidden></p>
        <button type="button" class="btn ghost" id="importRateCard">Upload to Blobs</button>
      </section>
      <section class="panel" aria-labelledby="leadListTitle">
        <h2 id="leadListTitle">Lead log</h2>
        <ul id="leadList" class="lead-list"></ul>
      </section>
      <section class="panel" aria-labelledby="calcTitle">
        <h2 id="calcTitle">Calculator</h2>
        <form id="calcForm" class="calc-grid">
          <label>Sign type <input name="signType" id="fSignType"></label>
          <label>Qty <input name="quantity" type="number" min="1" value="1"></label>
          <label>Width <input name="sizeW" type="number" step="0.5" min="0"></label>
          <label>Height <input name="sizeH" type="number" step="0.5" min="0"></label>
          <label>Unit
            <select name="sizeUnit"><option value="ft">ft</option><option value="in">in</option></select>
          </label>
          <label>Lighting
            <select name="lit"><option>Lit</option><option>Non-lit</option><option>Not sure</option></select>
          </label>
          <label>Height band
            <select name="height">
              <option value="">Unknown</option>
              <option>Ground floor, under 12 ft</option>
              <option>12–25 ft</option>
              <option>2nd floor or higher</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" name="permitsRequested"> Permits likely</label>
          <label class="check"><input type="checkbox" name="surveyConfirmed" id="fSurveyConfirmed"> Survey done, sizes confirmed (single total)</label>
          <button type="submit" class="btn gold">Calculate</button>
        </form>
        <div id="quoteOut" class="quote-out" hidden></div>
        <div class="actions">
          <label>Status <select id="fStatus"><option>New</option><option>Reviewing</option><option>Quoted</option><option>Won</option><option>Lost</option></select></label>
          <label>Quoted value <input id="fValue" placeholder="$0"></label>
          <label>Next step <input id="fNext" placeholder="Call GC, send proposal…"></label>
          <button type="button" class="btn ghost" id="saveLead">Save lead</button>
          <button type="button" class="btn gold" id="genProposal">Generate proposal draft</button>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/ops-qel16cb/ops.js"></script>
</body>
</html>
