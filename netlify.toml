[build]
  publish = "."

# Node 22.12+ is required by @netlify/blobs (sign mockup approval links, netlify/functions/).
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Header rules below never set the same header name on overlapping paths, because Netlify
# combines values when several rules match one URL.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# HTML: browsers always revalidate so a new deploy shows up immediately.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/thank-you"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/thank-you.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

# Versioned images (filenames carry .v1, .v2, ...): never overwrite a file here, add a new version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unversioned root icons: cache for a day, then revalidate.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Internal review docs are published with the site root but should never be indexed.
[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Phone approval links are private; keep them out of search results.
[[headers]]
  for = "/tools/sign-mockup/proof/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Hidden GWB league dashboard (URL-only; not linked from the public site).
[[headers]]
  for = "/gwb-fe006a16/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/gwb-fe006a16/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/gwb-fe006a16/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/gwb-fe006a16/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gwb-fe006a16/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gwb-fe006a16/slides/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendored libraries carry their version in the filename: never overwrite one, add a new version.
[[headers]]
  for = "/tools/sign-mockup/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sign fonts follow the same rule: the version is in the filename.
[[headers]]
  for = "/tools/sign-mockup/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Block internal repo files and image masters (site pages use /assets/* only).
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# /tools/sign-mockup/ is the only published path under /tools/. This rule must stay above the
# /tools/* block so the repo's build scripts in /tools/ keep returning 404.
[[redirects]]
  from = "/tools/sign-mockup/*"
  to = "/tools/sign-mockup/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# The publish root is the repo root, so keep function sources and npm files off the site.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/apps/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/service_photoreal_sprite_codex.png"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/logo_horizontal_navy_transparent.png"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/logo_horizontal_white_transparent.png"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/logo_icon_white_transparent_codex.png"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/favicon_512.png"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://arcsign.netlify.app/*"
  to = "https://arcsignco.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--arcsign.netlify.app/*"
  to = "https://arcsignco.com/:splat"
  status = 301
  force = true
